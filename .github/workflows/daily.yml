name: Daily box score update

on:
  schedule:
    # 10:00 UTC ≈ 5–6am ET — safely after West Coast finals are archived
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

permissions:
  contents: write         # lets the built-in GITHUB_TOKEN push the commit

concurrency:
  group: boxscore-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The updater no longer runs here, and cannot. As of 2026-10-10
      # cdn.nba.com (the v1 source) answers 403 to every client on every
      # network, including Chrome on a residential connection -- an Akamai
      # access rule, not a bot challenge. The only surviving source is
      # stats.nba.com leaguegamelog, which refuses datacenter IPs and so
      # refuses this runner. update_boxscores.py v2 therefore runs on
      # Alberto's machine and pushes from there.
      #
      # What a runner CAN still do is notice that nobody has run it. A laptop
      # left off for a fortnight in January produces exactly the same repo as
      # a healthy off-season, so this reads state.json and goes red when the
      # archive falls behind during a season. No network needed.
      - name: Archive freshness gate
        run: python scripts/check_freshness.py

      # Rebuilt from the whole archive every run, not appended to. A stint's last
      # game moves when a player plays again and its first game moves when a fix
      # lands in an old season, so there is nothing to append to -- and the whole
      # pass is about a minute against eighty seasons, which is cheaper than
      # working out what changed.
      # ALWAYS, even when the gate above went red. The timelines are derived
      # from the seasons already committed here and touch no network, so a
      # stale archive is no reason to skip rebuilding them. The job still
      # reports failure, so a stale archive does not go quiet.
      - name: Build player timelines
        if: always()
        run: python scripts/build_timelines.py

      - name: Commit & push if changed
        if: always()
        run: |
          git config user.name "boxscore-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update $(date -u +%F): $(git diff --cached --name-only | wc -l) file(s)"
            git push
          fi
