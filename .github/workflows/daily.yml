name: Daily box score update

on:
  schedule:
    # 10:00 UTC ≈ 5–6am ET — safely after West Coast finals are archived
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

permissions:
  contents: write         # lets the built-in GITHUB_TOKEN push the commit

concurrency:
  group: boxscore-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater
        run: python scripts/update_boxscores.py

      # Rebuilt from the whole archive every run, not appended to. A stint's last
      # game moves when a player plays again and its first game moves when a fix
      # lands in an old season, so there is nothing to append to -- and the whole
      # pass is about a minute against eighty seasons, which is cheaper than
      # working out what changed.
      # ALWAYS, even when the updater above failed. The timelines are derived
      # from the seasons already committed here and touch no network, so a fetch
      # failure upstream is no reason to skip them -- and while cdn.nba.com is
      # answering 403 to Actions runners, "the updater failed" is the normal case.
      # The job still reports failure, so the 403 does not go quiet.
      - name: Build player timelines
        if: always()
        run: python scripts/build_timelines.py

      - name: Commit & push if changed
        if: always()
        run: |
          git config user.name "boxscore-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update $(date -u +%F): $(git diff --cached --name-only | wc -l) file(s)"
            git push
          fi
